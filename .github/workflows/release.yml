name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: codemon-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: codemon-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: codemon-macos-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: codemon-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          bun build --compile --target=${{ matrix.target }} \
            src/cli/index.tsx \
            --outfile dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # merge-multiple flattens every artifact into dist/ directly. Without it
      # each one lands in a directory named after itself, so the binary sits at
      # dist/codemon-linux-arm64/codemon-linux-arm64 and any attempt to hoist it
      # collides with its own parent.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum codemon-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codemon-linux-x64
            dist/codemon-linux-arm64
            dist/codemon-macos-x64
            dist/codemon-macos-arm64
            dist/SHA256SUMS
          body: |
            ## 🐉 Codemon ${{ github.ref_name }}

            ### Installation

            **Linux (x64)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/codemon-linux-x64 -o codemon
            chmod +x codemon
            sudo mv codemon /usr/local/bin/
            ```

            **macOS (Apple Silicon)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/codemon-macos-arm64 -o codemon
            chmod +x codemon
            sudo mv codemon /usr/local/bin/
            ```

            **macOS (Intel)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/codemon-macos-x64 -o codemon
            chmod +x codemon
            sudo mv codemon /usr/local/bin/
            ```

            ### Verify checksums
            ```bash
            sha256sum --check SHA256SUMS
            ```
          generate_release_notes: true
